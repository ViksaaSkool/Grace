plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "com.grace.app"
    compileSdk 36

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId "com.grace.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.4"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildTypes {

        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix "_debug_" + getTimeStamp()

            buildConfigField "String", "BASE_URL", getLocalProperty('baseUrlDev')
            buildConfigField "String", "USERNAME", getLocalProperty('usernameDev')
            buildConfigField "String", "PASSWORD", getLocalProperty('passwordDev')
        }

        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "BASE_URL", getLocalProperty('baseUrlProd')
            buildConfigField "String", "USERNAME", getLocalProperty('usernameProd')
            buildConfigField "String", "PASSWORD", getLocalProperty('passwordProd')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn'
        ]
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            ]
        }
    }
}

kapt {
    correctErrorTypes true
}

def getLocalProperty(propertyName) {
    def value = project.findProperty(propertyName)
    if (value == null) {
        def localProperties = project.rootProject.file('local.properties')
        if (localProperties.exists()) {
            Properties properties = new Properties()
            localProperties.withInputStream { stream ->
                properties.load(stream)
            }
            value = properties.getProperty(propertyName, null)
        }
    }
    if (value == null) {
        return "null"
    }
    if (value.startsWith('"') && value.endsWith('"')) {
        return value
    }
    return "\"${value}\""
}


def getTimeStamp() {
    def date = new Date()
    def formattedDate = date.format('dd.MM.yyyy')
    return formattedDate
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"

    /* Hilt */
    implementation 'com.google.dagger:hilt-android:2.57.2'
    kapt 'com.google.dagger:hilt-android-compiler:2.57.2'

    /* AndroidX + Compose */
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.7'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    implementation 'androidx.hilt:hilt-lifecycle-viewmodel-compose:1.3.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation platform('androidx.compose:compose-bom:2026.01.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.material:material:1.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    /* Retrofit 3.0 */
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    /* Glide */
    implementation 'com.github.bumptech.glide:glide:5.0.5'

    /* Multidex */
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "com.google.mlkit:image-labeling:17.0.9"

    /* Coroutines */
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

}
